<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>来源 VNC 节律：真行走与拖滑对照</title><style>:root{--ink:#eaf5ff;--muted:#8ba5b8;--cyan:#56d6ff;--green:#69e5a0;--gold:#ffb454;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:#071018;color:var(--ink);font:14px system-ui,sans-serif;overflow:hidden}#view{position:fixed;inset:0;width:100%;height:100%;cursor:grab}.panel{position:fixed;left:18px;top:16px;width:min(720px,calc(100vw - 36px));background:#071018e9;border:1px solid #29445a;border-radius:14px;padding:14px 16px;backdrop-filter:blur(12px)}h1{font-size:20px;margin:0 0 6px}.ok{color:var(--green)}.warn{color:#ffca81}.muted{color:var(--muted);font-size:12px}.row{display:flex;gap:10px;align-items:center}select,button{border:1px solid #38546a;background:#102638;color:var(--ink);border-radius:8px;padding:8px 10px}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-top:10px}.v{font-size:16px;color:var(--cyan);font-variant-numeric:tabular-nums;white-space:nowrap}.k{font-size:10px;color:var(--muted)}.meter{height:6px;background:#233a4b;border-radius:5px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--gold)}.controls{position:fixed;left:18px;bottom:18px;display:flex;gap:8px;background:#071018e8;border:1px solid #29445a;padding:9px;border-radius:12px}.legend{position:fixed;right:18px;bottom:18px;background:#071018e8;border:1px solid #29445a;border-radius:12px;padding:10px 13px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}</style></head><body><canvas id="view"></canvas><section class="panel"><div class="row"><h1 style="flex:1">VNC 节律因果实验 · <span class="warn">全脑自主行走未完成</span></h1><select id="episode"></select></div><div class="muted">可切换完整神经节律与冻结神经状态；两者均为同一冻结工程解码器＋56 关节自由身体。计数采用持续接地—离地—再接地，不用足尖抖动峰。</div><div class="stats"><div><div class="v" id="time">0.000 s</div><div class="k">时间</div></div><div><div class="v" id="forward">0.00 mm</div><div class="k">净前进</div></div><div><div class="v" id="speed">0.0 mm/s</div><div class="k">瞬时速度</div></div><div><div class="v" id="cycles">0/0/0/0/0/0</div><div class="k">六腿接触步数</div></div><div><div class="v" id="contact">0/6</div><div class="k">足接触</div></div><div><div class="v" id="tilt">0.000</div><div class="k">身体倾斜</div><div class="meter"><i id="tiltbar"></i></div></div><div><div class="v" id="residual">0.000</div><div class="k">VNC 解码相位</div><div class="meter"><i id="resbar"></i></div></div></div><div class="muted warn" id="boundary">完整节律可形成六足步态；冻结节律仍能移动，但前三足没有合格步数、足部拖滑。工程关节解码器仍在，尚非全脑自主行走。</div></section><div class="controls"><button id="play">暂停</button><button id="restart">重播</button><button id="follow">跟随身体：开</button></div><div class="legend"><div><span class="dot" style="background:#56d6ff"></span>左侧身体链</div><div><span class="dot" style="background:#69e5a0"></span>右侧身体链</div><div><span class="dot" style="background:#ffb454"></span>运动轨迹</div><div><span class="dot" style="background:#ff6b6b"></span>身体触地警示</div><div>拖动旋转 · 滚轮缩放</div></div><script>fetch("results/vnc-core-causal-audit-20260924/causal-walking-replay.json").then(r=>r.json()).then(init);function init(D){const c=document.querySelector('#view'),x=c.getContext('2d'),sel=document.querySelector('#episode');D.episodes.forEach((e,i)=>sel.add(new Option(e.label,i)));let E=D.episodes[0],W,H,ratio=1,yaw=-.75,pitch=.48,zoom=62,playing=true,follow=true,frame=0,last=performance.now(),drag=null;sel.onchange=()=>{E=D.episodes[+sel.value];frame=0};function size(){ratio=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*ratio;c.height=H*ratio;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(ratio,0,0,ratio,0,0)}addEventListener('resize',size);size();c.onpointerdown=e=>{drag=[e.clientX,e.clientY,yaw,pitch];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){yaw=drag[2]+(e.clientX-drag[0])*.008;pitch=Math.max(-.05,Math.min(1.35,drag[3]+(e.clientY-drag[1])*.006))}};c.onpointerup=()=>drag=null;c.onwheel=e=>{zoom=Math.max(20,Math.min(180,zoom*Math.exp(-e.deltaY*.001)));e.preventDefault()},{passive:false};play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'继续'};restart.onclick=()=>frame=0;document.querySelector('#follow').onclick=()=>{follow=!follow;document.querySelector('#follow').textContent='跟随身体：'+(follow?'开':'关')};function rot(p,o){let X=p[0]-o[0],Y=p[1]-o[1],Z=p[2]-o[2],cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),a=cy*X-sy*Y,b=sy*X+cy*Y;return[W*.5+a*zoom,H*.64-(cp*Z-sp*b)*zoom,b*cp+Z*sp]}function draw(){requestAnimationFrame(draw);let now=performance.now(),dt=(now-last)/1000;last=now;if(playing)frame=(frame+dt*D.fps)%E.frames.length;let i=Math.floor(frame),P=E.frames[i],center=follow?P[D.center_index]:E.world_center;x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#102b40');g.addColorStop(1,'#050b10');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='#23445a';x.lineWidth=1;for(let k=-12;k<=12;k++){for(let axis=0;axis<2;axis++){let a=center.slice(),b=center.slice();a[axis]+=k;a[1-axis]-=12;b[axis]+=k;b[1-axis]+=12;a[2]=b[2]=E.floor_z;let A=rot(a,center),B=rot(b,center);x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.stroke()}}let trail=[];for(let q=0;q<=i;q+=8)trail.push(rot(E.frames[q][D.center_index],center));x.strokeStyle='#ffb454';x.lineWidth=2;x.beginPath();trail.forEach((p,j)=>j?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();let V=P.map(p=>rot(p,center));for(const [a,b]of D.edges){let A=V[a],B=V[b],n=D.names[a]+D.names[b];x.strokeStyle=E.body_contact[i]?'#ff6b6b':n.includes('left')?'#56d6ff':n.includes('right')?'#69e5a0':'#d7e4ec';x.lineWidth=3;x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.stroke()}for(let j=0;j<V.length;j++){x.fillStyle='#eaf5ff';x.beginPath();x.arc(V[j][0],V[j][1],2.4,0,Math.PI*2);x.fill()}time.textContent=(i/D.fps).toFixed(3)+' s';forward.textContent=E.forward_mm[i].toFixed(2)+' mm';speed.textContent=E.speed_mm_s[i].toFixed(1)+' mm/s';cycles.textContent=E.cumulative_cycles[i].join('/');contact.textContent=E.contact[i].reduce((a,b)=>a+b,0)+'/6';tilt.textContent=E.tilt[i].toFixed(3);residual.textContent=E.residual_rms[i].toFixed(3);tiltbar.style.width=Math.min(100,E.tilt[i]*1000)+'%';resbar.style.width=Math.min(100,E.residual_rms[i]/D.period_frames*100)+'%'}draw()}</script></body></html>
